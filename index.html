<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#faf8f4" />
    <!-- viewport-fit=cover lets the phone tab bar reach behind the iPhone
         home indicator; it pads itself clear with env(safe-area-inset-bottom). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Original Korean skincare and makeup, delivered across Uzbekistan." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
    />
    <title>K-Glow Secrets</title>
    <!-- Link-preview card for the home page. Every other path is answered by
         api/preview.ts for preview bots, but "/" is served straight from this
         file before any rewrite runs, so its tags have to live here. The
         image needs a full address: update it when the shop gets its own
         domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="K-Glow Secrets" />
    <meta property="og:title" content="K-Glow Secrets — original koreys kosmetikasi" />
    <meta property="og:description" content="Original koreys parvarish va dekorativ kosmetikasi — toʻgʻridan-toʻgʻri Seuldan, butun Oʻzbekiston boʻylab yetkazib beramiz." />
    <meta property="og:image" content="https://k-glow-react.vercel.app/img/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
